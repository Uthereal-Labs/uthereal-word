<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#243e5b"><meta name="description" content="Quire — a local-first, Word-inspired document editor with a WebGPU compositor."><title>Quire — The clarity report</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232d5e89'/%3E%3Ctext x='8' y='30' font-size='30' fill='white' font-family='Georgia'%3Eq%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./src/styles.css"></head>
<body>
<div id="app">
<header class="titlebar">
 <button class="brand" data-action="about" aria-label="About Quire"><span class="brand-mark">q<span></span></span><span>Quire</span></button><span class="top-divider"></span>
 <div class="document-title"><input id="document-title" aria-label="Document name" value="The clarity report" maxlength="120"><span data-icon="chevron" class="title-chevron"></span></div>
 <span class="save-indicator" id="save-indicator"><span data-icon="cloud"></span><span>Saved on this device</span></span>
 <div class="quick-actions"><button data-action="undo" title="Undo (Ctrl+Z)" data-icon="undo"></button><button data-action="redo" title="Redo (Ctrl+Shift+Z)" data-icon="redo"></button></div>
 <button class="command-search" data-action="commands"><span data-icon="search"></span><span>Search tools and commands</span><kbd>Ctrl K</kbd></button>
 <button class="top-help" data-action="shortcuts" title="Keyboard shortcuts" data-icon="keyboard"></button><div class="avatar" title="Local workspace · You">Y</div>
</header>
<div class="menu-row"><nav class="ribbon-tabs" aria-label="Ribbon tabs"><button data-action="file" class="file-tab">File</button><button data-tab="Home" class="active">Home</button><button data-tab="Insert">Insert</button><button data-tab="Draw">Draw</button><button data-tab="Design">Design</button><button data-tab="Layout">Layout</button><button data-tab="References">References</button><button data-tab="Review">Review</button><button data-tab="View">View</button></nav><div class="menu-actions"><button data-action="comments"><span data-icon="comment"></span><span>Comments</span><span id="comment-count" class="count-badge">0</span></button><button id="editing-mode" data-action="toggle-reading"><span data-icon="pen"></span><span>Editing</span><span data-icon="chevron"></span></button><button class="primary small" data-action="export"><span data-icon="download"></span>Export<span data-icon="chevron"></span></button></div></div>
<section class="ribbon" id="ribbon" aria-label="Home ribbon"></section>
<main class="workspace">
 <aside class="navigation" id="navigation"><div class="panel-heading"><h2>Navigation</h2><button data-action="toggle-navigation" title="Close navigation" data-icon="close"></button></div><div class="nav-search"><span data-icon="search"></span><input id="nav-search" placeholder="Find in document" aria-label="Find in document"><kbd>Ctrl F</kbd></div><div id="replace-controls" hidden><input id="replace-input" placeholder="Replace with" aria-label="Replace with"><div><button data-action="replace-one">Replace</button><button data-action="replace-all">Replace all</button></div></div><div id="search-status" class="search-status" hidden></div><div class="nav-tabs"><button class="active" data-nav="headings">Headings</button><button data-nav="pages">Pages</button><button data-nav="results">Results</button></div><div id="nav-content" class="nav-content"></div><div class="navigation-footer"><div class="local-icon" data-icon="shield"></div><div><strong>Your words. Your workspace.</strong><p>Private by default. Saved locally.</p></div></div></aside>
 <section class="editor-area" id="editor-area" aria-label="Document workspace"><div class="workspace-bar"><div><span class="workspace-dot"></span><span id="workspace-name">THE CLARITY REPORT</span><span class="workspace-separator">/</span><span>Document</span></div><button data-action="page-setup" class="paper-label">A4 <span>·</span> Portrait <span data-icon="chevron"></span></button></div><div class="ruler-wrap" id="ruler-wrap"><div id="ruler" class="ruler"><span class="ruler-margin left-margin"></span><div class="ruler-ticks"></div><span class="ruler-margin right-margin"></span><i class="indent-marker start"></i><i class="indent-marker end"></i></div></div><div id="viewport" class="viewport"><canvas id="gpu-canvas" aria-hidden="true"></canvas><div id="page-stack" class="page-stack"></div><div class="end-document"><span></span> A little space for your next big idea. <span></span></div></div><button class="exit-focus" data-action="focus"><span data-icon="target"></span>Exit focus <kbd>Esc</kbd></button></section>
 <aside id="review-panel" class="review-panel" hidden></aside>
 <aside class="activity-rail"><button class="rail-active" data-action="toggle-navigation" title="Navigation" data-icon="toc"></button><button data-action="comments" title="Comments" data-icon="comment"></button><button data-action="insights" title="Document insights" data-icon="checkcircle"></button><span class="rail-divider"></span><button data-action="theme" title="Toggle dark workspace" data-icon="moon"></button><button data-action="focus" title="Focus mode" data-icon="target"></button><div class="rail-bottom"><button data-action="about" title="Engine information" data-icon="info"></button></div></aside>
</main>
<footer class="statusbar"><div class="status-left"><button id="page-status" data-action="goto-page">Page 1 of 3</button><span class="status-divider"></span><button id="word-count" data-action="insights">0 words</button><span class="status-divider"></span><span class="language"><span data-icon="checkcircle"></span>English (US)</span></div><div class="status-right"><button class="engine-status" id="engine-status" data-action="about"><span class="engine-dot"></span><span>Starting renderer</span></button><span class="status-divider"></span><button data-action="focus" title="Focus mode" data-icon="target"></button><button id="print-view" data-action="edit-mode" class="view-button active" title="Print layout" data-icon="page"></button><button id="read-view" data-action="read-mode" class="view-button" title="GPU reading mode" data-icon="book"></button><span class="status-divider"></span><button data-action="zoom-out" title="Zoom out" data-icon="minus"></button><input id="zoom" type="range" min="40" max="180" value="85" aria-label="Document zoom"><button data-action="zoom-in" title="Zoom in" data-icon="plus"></button><button id="zoom-label" data-action="fit-width">85%</button></div></footer>
</div>
<div id="popover" class="popover" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog><div id="toasts" class="toasts" role="status" aria-live="polite"></div><input id="file-input" type="file" accept=".quire,.json,.html,.htm,.txt,.md,.docx" hidden><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script type="module" src="./src/app.js"></script>
</body></html>
