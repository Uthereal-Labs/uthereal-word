name: Deploy Quire to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for file in src/*.js *.mjs; do
            node --check "$file"
          done
      - name: Build static site
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify published application
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify live HTTPS response
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${SITE_URL}?deployment=${GITHUB_SHA}" -o /tmp/quire-live.html
          grep -q '<title>Quire' /tmp/quire-live.html
          grep -q 'window.quire =' /tmp/quire-live.html
      - name: Run browser integration against the published site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/test_editor.py --url "$SITE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site-test-results
          path: |
            tests/test-results.json
            tests/output/
